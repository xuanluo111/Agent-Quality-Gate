name: AQG CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Verify supply-chain lock integrity (C10, offline)
        # 阻断门禁：每个直接依赖必须在 requirements.lock 精确锁定且满足声明下界。纯标准库、不联网。
        run: python scripts/check_supply_chain.py
      - name: Rebuild deterministic suites
        run: python scripts/build_suite.py
      - name: Lint test cases (K13, four-question completeness)
        # warning 起步：红叉可见但不卡流水线。存量缺陷登记在
        # docs/quality/case-lint-exemptions.json（改 case 会动 dataset_sha256 → 切代），
        # 豁免外的任何新增退化都会在这里亮红。
        continue-on-error: true
        run: python scripts/lint_cases.py --json
      - name: Validate smoke suite without calling a model
        run: python scripts/run_eval.py --suite smoke --dry-run --limit 0

  supply-chain:
    # C10 软件供应链：从同一份 requirements.lock 出 SBOM 并做已知漏洞扫描。
    # 单一 Python 版本即可（lock 是按解析快照生成的，SBOM/审计只读该清单）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SBOM & audit tools
        run: pip install cyclonedx-bom pip-audit
      - name: Generate CycloneDX SBOM from the lock
        run: cyclonedx-py requirements --sv 1.5 --output-reproducible -o sbom.json requirements.lock
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqg-sbom
          path: sbom.json
      - name: Audit pinned dependencies for known vulnerabilities
        # 咨询级：把已知 CVE 报出来供人判断，不因私有网关镜像里解析不到的包而卡死流水线。
        # 阻断式的供应链门禁由上面的 lock 完整性校验承担（可离线、可单测、口径稳定）。
        continue-on-error: true
        run: pip-audit -r requirements.lock --progress-spinner off

  pr-comment:
    # T22（RM-06）：PR 上自动贴批次门禁摘要＋逐场阻断原因。
    # 渲染与投递分离：pr_comment.py 只产 Markdown（纯标准库、零 token、不调模型），
    # 投递用 Actions 自带 token——不需要任何额外 secret。数字只来自随仓库分发的
    # reports/batch-*/summary.json（白名单件），外部可复核；报告正文刻意不进评论。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render gate summary from committed batch
        # 找不到入库批次（退出码 3）不是退化：投不了评论就优雅跳过，不卡流水线。
        run: |
          set +e
          python scripts/pr_comment.py --out pr-comment.md
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "has_comment=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "3" ]; then
            echo "::notice::仓库内没有批次 summary.json，跳过 PR 评论"
          else
            exit "$rc"
          fi
        id: render
      - name: Post comment to PR
        if: steps.render.outputs.has_comment == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # \u5fc5\u987b\u663e\u5f0f\u4f20\u53f7\uff1aPR \u4e8b\u4ef6\u4e0b checkout \u662f detached HEAD\uff0cgh \u9760\u5206\u652f\u63a8\u65ad\u4f1a\u62a5
          # "could not determine current branch"\uff08demo PR #1 \u5b9e\u6293\uff09
          PR_NUMBER: ${{ github.event.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file pr-comment.md
