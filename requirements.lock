# C10 软件供应链锁定清单（ISACA「模型·供应商·软件供应链」的框架侧自证锚点）。
#
# 为什么要有这份文件：requirements.txt 用的是区间约束（openai>=1.30.0 等），同一份
# 代码在不同时间、不同机器解析出的传递依赖可能不同——一旦上游发版带进已知漏洞或破坏性
# 变更，评测结果就不可复现，也说不清「这次跑的版本」到底是哪个。锁定清单把整棵依赖树
# 钉成精确版本，CI 装它、pip-audit 审它、SBOM 从它生成，三者口径一致。
#
# 生成方式（勿手改，改依赖后重新生成）：
#   python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
#   .venv/bin/pip freeze > requirements.lock
# 校验方式（scripts/check_supply_chain.py，离线单测覆盖）：每个直接依赖都必须在此
# 以 == 精确锁定，且版本满足 requirements.txt 声明的区间下界。
#
# 快照环境：macOS / CPython 3.13（跨平台纯 Python 包一致；含平台二进制的包以各自
# wheel 为准，CI 在 ubuntu 上按同名同版本解析）。
