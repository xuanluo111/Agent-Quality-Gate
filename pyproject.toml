[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-quality-gate"
version = "0.1.0"
description = "A layered evaluation harness for AI agent safety, tool use, and data routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
packages = ["src", "src.engine", "src.models", "src.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = []
addopts = "-ra"
