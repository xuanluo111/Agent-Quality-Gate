[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-quality-gate"
version = "0.4.0"
description = "A layered evaluation harness for AI agent safety, tool use, and data routing."
readme = "README.md"
requires-python = ">=3.11"
# 本仓库是「代码 + 评测数据」双许可：这份 distribution 只打包代码（见下方 packages），
# 所以 SPDX 写 MIT；仓内 `cases/` 与 `reports/` 属评测数据，适用 CC-BY-4.0，
# 声明见 LICENSE-DATA（它们不随 wheel 分发）。代码许可证文本在 LICENSE。
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
packages = ["src", "src.engine", "src.models", "src.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = []
addopts = "-ra"
